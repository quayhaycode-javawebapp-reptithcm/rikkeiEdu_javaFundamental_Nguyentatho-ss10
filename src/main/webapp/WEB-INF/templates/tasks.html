<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách công việc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h2 class="text-center mb-4">DANH SÁCH CÔNG VIỆC</h2>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
    <tr>
        <th>Mã CV</th>
        <th>Tên công việc</th>
        <th>Hạn hoàn thành</th>
        <th>Mức độ ưu tiên</th>
    </tr>
    </thead>
    <tbody>
    <!-- Sử dụng th:each để lặp qua danh sách công việc -->
    <tr th:each="task : ${tasks}">
        <td th:text="${task.id}"></td>
        <td th:text="${task.title}"></td>
        <td th:text="${#temporals.format(task.deadline, 'dd/MM/yyyy')}"></td>
        <td>
            <!-- Hiển thị màu sắc dựa trên mức độ ưu tiên -->
            <span th:text="${task.priority}"
                  th:classappend="${task.priority == 'HIGH' ? 'badge bg-danger' : (task.priority == 'MEDIUM' ? 'badge bg-warning text-dark' : 'badge bg-info text-dark')}">
                    </span>
        </td>
    </tr>
    <!-- Hiển thị thông báo nếu danh sách trống -->
    <tr th:if="${tasks.isEmpty()}">
        <td colspan="4" class="text-center">Hiện chưa có công việc nào.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
